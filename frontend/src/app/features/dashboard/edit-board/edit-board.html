<app-basic-modal [isOpen]="isOpen()" (closeModal)="onClose()">
  <h2 modal-header>{{ initialData() ? 'Edit Board' : 'Create New Board' }}</h2>

  <form [formGroup]="boardForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="board-title">Title</label>
      <input id="board-title" type="text" formControlName="title" placeholder="Add title" />
    </div>

    <div class="form-group">
      <label for="board-description">Description</label>
      <textarea
        id="board-description"
        formControlName="description"
        placeholder="Add Description"
      ></textarea>
    </div>

    <div modal-footer class="actions">
      <button type="button" class="btn-cancel" (click)="onClose()">Cancel</button>

      <button type="submit" class="btn-add" [disabled]="boardForm.invalid">
        {{ initialData() ? 'Save' : 'Add' }}
      </button>
    </div>
  </form>
</app-basic-modal>
