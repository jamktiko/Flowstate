<app-basic-modal [isOpen]="isOpen()" (closeModal)="closeModal.emit()">
  <div class="calendar-modal-content">
    <button class="calendar-button" (click)="goToCalendar()">
      <span class="calendar-icon" aria-hidden="true">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" stroke-width="2" />
          <path d="M8 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M16 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M3 10H21" stroke="currentColor" stroke-width="2" />
        </svg>
      </span>

      <span>Calendar</span>
    </button>
  </div>
</app-basic-modal>
