<app-basic-modal [isOpen]="isOpen()" (closeModal)="closeModal.emit()">
  <div class="delete-modal">
    <h3 modal-header class="delete-title">Delete Board</h3>

    <p class="delete-text">
      Are you sure you want to delete this board? This action cannot be undone.
    </p>

    <div modal-footer class="modal-actions">
      <button type="button" class="cancel-btn" (click)="closeModal.emit()">No, Cancel</button>
      <button type="button" class="confirm-btn" (click)="deleteBoard()">Yes, Delete</button>
    </div>
  </div>
</app-basic-modal>
