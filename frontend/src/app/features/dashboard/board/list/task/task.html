<div
  class="task-card"
  (click)="openDetail()"
  (keydown.enter)="openDetail()"
  (keydown.space)="openDetail()"
  role="button"
  tabindex="0"
>
  <div class="task-header">
    <h4 class="task-title">{{ card().title }}</h4>
    <div class="task-actions-wrapper">
      <button class="task-actions" (click)="toggleMenu($event)">&#8942;</button>

      @if (isMenuOpen()) {
        <div class="dropdown-menu" [style.top.px]="menuTop()" [style.right.px]="menuRight()">
          <button class="dropdown-item" (click)="editTask($event)">Edit</button>
          <button class="dropdown-item delete" (click)="deleteTask($event)">Delete</button>
        </div>
      }
    </div>
  </div>
  @if (card().description) {
    <p class="task-description">{{ card().description }}</p>
  }
</div>

@if (isDetailOpen()) {
  <app-task-detail
    [isOpen]="isDetailOpen()"
    [card]="card()"
    [boardId]="boardId()"
    [colId]="colId()"
    (closeModal)="isDetailOpen.set(false)"
    (calendarEventCreated)="isDetailOpen.set(false)"
  ></app-task-detail>
}

@if (isEditModalOpen()) {
  <app-edit-task
    [isOpen]="isEditModalOpen()"
    [initialData]="card()"
    (closeModal)="isEditModalOpen.set(false)"
    (saveTask)="onTaskSaved($event)"
  ></app-edit-task>
}
