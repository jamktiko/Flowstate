<app-basic-modal [isOpen]="isOpen()" (closeModal)="onClose()">
  <form class="task-modal" [formGroup]="taskForm" (ngSubmit)="onSubmit()">
    <h2 class="modal-title">Edit Task</h2>

    <fieldset class="form-group priority-group">
      <legend class="section-label">Priority</legend>

      <div class="priority-options">
        <label class="priority-label high">
          <input type="radio" formControlName="priority" value="high" />
          <span>High</span>
        </label>

        <label class="priority-label medium">
          <input type="radio" formControlName="priority" value="medium" />
          <span>Medium</span>
        </label>

        <label class="priority-label low">
          <input type="radio" formControlName="priority" value="low" />
          <span>Low</span>
        </label>
      </div>
    </fieldset>

    <div class="form-group">
      <label for="edit-task-title" class="sr-only">Title</label>
      <input id="edit-task-title" type="text" formControlName="title" placeholder="Edit title" />
    </div>

    <div class="form-group">
      <label for="edit-task-description" class="sr-only">Description</label>
      <textarea
        id="edit-task-description"
        formControlName="description"
        placeholder="Description"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="edit-task-due-date" class="sr-only">Due date</label>
      <input id="edit-task-due-date" type="date" formControlName="dueDate" />
    </div>

    <fieldset class="form-group tag-group" formGroupName="tags">
      <legend class="section-label">Tags</legend>

      <div class="tag-options">
        <label class="tag-label">
          <input type="checkbox" formControlName="backend" />
          <span>Backend</span>
        </label>

        <label class="tag-label">
          <input type="checkbox" formControlName="security" />
          <span>Security</span>
        </label>

        <label class="tag-label">
          <input type="checkbox" formControlName="frontend" />
          <span>Frontend</span>
        </label>

        <label class="tag-label">
          <input type="checkbox" formControlName="urgent" />
          <span>Urgent</span>
        </label>
      </div>
    </fieldset>

    <div modal-footer class="actions">
      <button type="button" class="btn-cancel" (click)="onClose()">Cancel</button>
      <button type="submit" class="btn-add" [disabled]="taskForm.invalid">Save</button>
    </div>
  </form>
</app-basic-modal>
