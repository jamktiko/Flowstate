<div class="list-container">
  <div class="list-header">
    <h3 class="list-title">{{ column().name }}</h3>
  </div>

  <div class="list-cards">
    @for (card of column().cards; track card._id) {
      <app-task 
        [card]="card" 
        (taskUpdated)="taskUpdated.emit($event)"
        (taskDeleted)="taskDeleted.emit({ card: $event, columnId: column().id })"
      ></app-task>
    }
  </div>

  <div class="list-footer"></div>
</div>
