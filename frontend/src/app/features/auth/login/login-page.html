<app-auth-layout class="login-layout" title="Sign In">
  <h2>Sign in</h2>
  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <!-- Email Field -->
    <div>
      <label for="email">Email address</label>
      <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
    </div>

    <!-- Password Field -->
    <div>
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" placeholder="••••••••" />
    </div>

    <button class="submit-btn" type="submit" [disabled]="loginForm.invalid">Sign in</button>
  </form>

  <div class="social-section">
    <p>Or sign in with</p>

    <div class="social-buttons">
      <button type="button" class="social-btn">
        <p>M</p>
      </button>

      <button type="button" class="social-btn">
        <p>G</p>
      </button>
    </div>
  </div>
  <!-- Submit Button -->
  <button type="submit" [disabled]="loginForm.invalid">Sign In</button>

  <!-- Link to Register -->
  <p class="auth-redirect">
    Don't have an account? <a routerLink="/auth/register">Sign up here</a>.
  </p>
</app-auth-layout>
