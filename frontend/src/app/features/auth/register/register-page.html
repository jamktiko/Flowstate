<app-auth-layout>
  <h2>Create an account</h2>
  <form [formGroup]="registerForm" (ngSubmit)="register()">
    <div>
      <label for="firstName">First Name</label>
      <input id="firstName" type="text" formControlName="firstName" />
    </div>

    <div>
      <label for="surname">Last Name</label>
      <input id="surname" type="text" formControlName="surname" />
    </div>

    <div>
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
    </div>

    <div>
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" />
      <p class="password-hint">
        Password must be at least 8 characters long and contain 1 lower and uppercase letter, 1
        number, and 1 special character.
      </p>
    </div>

    <button class="submit-btn" type="submit" [disabled]="registerForm.invalid">Sign up</button>
  </form>

  <div class="social-section">
    <p>Or sign up with</p>

    <div class="social-buttons">
      <button type="button" class="social-btn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="43"
          height="40"
          viewBox="0 0 43 40"
          fill="none"
        >
          <path d="M20.881 19.338H5.05884V5.9259H20.881V19.338Z" fill="#F1511B" />
          <path d="M38.3504 19.338H22.5286V5.9259H38.3504V19.338Z" fill="#80CC28" />
          <path d="M20.8805 34.1517H5.05884V20.7397H20.8805V34.1517Z" fill="#00ADEF" />
          <path d="M38.3504 34.1517H22.5286V20.7397H38.3504V34.1517Z" fill="#FBBC09" />
        </svg>
      </button>
      <button type="button" class="social-btn" (click)="signInWithGoogle()">
        <p>G</p>
      </button>
    </div>
  </div>
</app-auth-layout>
