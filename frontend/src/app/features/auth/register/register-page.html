<app-auth-layout title="Create an account">
  <h2>Create an account</h2>
  <form [formGroup]="registerForm" (ngSubmit)="register()">
    <div>
      <label for="firstName">First Name</label>
      <input id="firstName" type="text" formControlName="firstName" />
    </div>

    <div>
      <label for="surname">Last Name</label>
      <input id="surname" type="text" formControlName="surname" />
    </div>

    <div>
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
    </div>

    <div>
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" />
      <p class="password-hint">
        Password must be at least 8 characters long and contain 1 lower and uppercase letter, 1
        number, and 1 special character.
      </p>
    </div>

    <button class="submit-btn" type="submit" [disabled]="registerForm.invalid">Sign up</button>
  </form>

  <div class="social-section">
    <p>Or sign up with</p>

    <div class="social-buttons">
      <button type="button" class="social-btn">
        <p>M</p>
      </button>
      <button type="button" class="social-btn">
        <p>G</p>
      </button>
    </div>
  </div>
</app-auth-layout>
